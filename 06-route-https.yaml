apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-route
  namespace: demo
spec:
  parentRefs:
  - name: kong-gateway
    namespace: kong
    sectionName: https
  hostnames: ["hello.example.local"]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - name: hello-v1
      port: 80
