apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kong-prometheus
  namespace: kong
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [kong]
  selector:
    matchLabels:
      app.kubernetes.io/name: kong-prometheus-metrics
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
